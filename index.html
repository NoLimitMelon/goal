<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Twitch Goal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Teko:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background: transparent;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
    }

    #goal-container {
      width: 600px;
      padding: 20px;
      background: rgba(24, 24, 27, 0.85);
      border-radius: 16px;
      border: 1px solid #3a3a40;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #title {
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    #progress-bar {
      position: relative;
      background-color: #1f1f23;
      border-radius: 12px;
      height: 50px;
      border: 2px solid #3a3a40;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #772CE8 0%, #9146FF 100%);
      box-shadow: 0 0 12px rgba(145, 70, 255, 0.8);
      transition: width 0.5s ease-in-out;
    }

    #text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      width: 100%;
      text-align: center;
    }

    #subtext {
      margin-top: 10px;
      font-size: 14px;
      color: #adadb8;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="goal-container">
    <div id="title">ROAD TO <span id="goal-target-title">200</span> FOLLOWERS!</div>
    
    <div id="progress-bar">
      <div id="bar"></div>
      <div id="text">
        <span id="current">0</span> / <span id="goal">200</span> (<span id="percent">0%</span>)
      </div>
    </div>
    
    <div id="subtext">
      <span id="amount-left">--</span> followers to next goal!
    </div>
  </div>

  <script>
    // Config: Replace with your Twitch details
    const CHANNEL_NAME = "archivemelon1"; 
    const CLIENT_ID = "bci583ogkm5s02qm7z460h3c6x9w6n";
    const OAUTH_TOKEN = "gy5x62ndmtcswo8qsr3llx4k386txh7tvevha7jnj3us37t5r2"; // Require 'user:read:broadcast' scope
    
    let currentFollowers = 156; // Default fallback starting value
    let targetGoal = 200;

    function updateDisplay() {
      // Auto-Increment Logic: Add +50 automatically whenever target is reached
      while (currentFollowers >= targetGoal) {
        targetGoal += 50;
      }

      const percentage = Math.min(Math.round((currentFollowers / targetGoal) * 100), 100);
      const remaining = Math.max(targetGoal - currentFollowers, 0);

      document.getElementById('current').innerText = currentFollowers;
      document.getElementById('goal').innerText = targetGoal;
      document.getElementById('goal-target-title').innerText = targetGoal;
      document.getElementById('percent').innerText = percentage + '%';
      document.getElementById('amount-left').innerText = remaining;
      document.getElementById('bar').style.width = percentage + '%';
    }

    // Connect to Twitch EventSub WebSocket for live follower updates
    function connectTwitchWS() {
      const socket = new WebSocket('wss://eventsub.wss.twitch.tv/ws');

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        // Listen for channel.follow events directly from Twitch
        if (data.metadata && data.metadata.message_type === 'notification') {
          if (data.payload.subscription.type === 'channel.follow') {
            currentFollowers += 1;
            updateDisplay();
          }
        }
      };

      socket.onclose = () => {
        setTimeout(connectTwitchWS, 5000); // Reconnect if disconnected
      };
    }

    // Initialize display and start auto-listener
    updateDisplay();
    connectTwitchWS();
  </script>
</body>
</html>
